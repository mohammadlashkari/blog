version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/post/*.sql"
    schema: "internal/migration/*.sql"
    gen:
      go:
        package: "post"
        out: "internal/post"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "posts.language"
            go_type:
              type: "Language"
