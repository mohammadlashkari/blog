version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/query/*.sql"
    schema: "internal/store/migration/*.sql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "posts.language"
            go_type:
              type: "Language"
